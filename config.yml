# mine-zettelkasten configuration (MINE team fork of fg-zettelkasten)
# CLI arguments override these values.

inputs:
  # mine-toread enriched JSON Feed — GitHub Contents API, served fresh. The raw
  # CDN caches ~5 min and mine-zk:summarize runs seconds after mine-toread
  # commits, so a cached read would miss brand-new papers.
  feed_url: "https://api.github.com/repos/fabiogiglietto/mine-toread/contents/output/feed.json"
  # research-radio podcast episodes — GitHub Contents API (same reason).
  # Left pointing at research-radio: Fabio's papers (still flowing through the
  # mine-toread feed via Paperpile) keep their episode links; team submissions
  # simply won't match an episode.
  episodes_url: "https://api.github.com/repos/fabiogiglietto/research-radio/contents/docs/episodes.json"
  # Fabio Giglietto's own publications — a second paper source (see the
  # `own_publications` section). raw CDN is fine: own papers change rarely.
  own_publications_url: "https://raw.githubusercontent.com/fabiogiglietto/fabiogiglietto.github.io/main/public/data/own-publications.json"
  # fabiogiglietto.github.io research-agenda signals — fetched live from the published repo
  github_io_base: "https://raw.githubusercontent.com/fabiogiglietto/fabiogiglietto.github.io/main"
  github_io_signals:
    - "_data/projects.yml"
    - "_data/publications.yml"
    - "_data/teaching.yml"
    - "_data/news.yml"
    - "scripts/config.js"
    - "scripts/data/bio-seed.md"

claude:
  # Per-paper full-PDF summary pass — the bulk of the cost. Deliberately kept
  # on Opus: the summary is the flagship artifact every downstream stage
  # (podcast script, notes, structure notes) builds on.
  summary_model: "claude-opus-4-8"
  # Generative prose: register synthesis, emergent clustering and hub-note
  # narratives.
  reasoning_model: "claude-sonnet-5"
  # Paper-note bodies — deliberately the best model: the Connections
  # paragraph is the kasten's intellectual glue and worth Opus rates.
  # Falls back to reasoning_model when unset.
  note_model: "claude-opus-4-8"
  # Mechanical per-paper topic classification (themes.assign_paper).
  # Falls back to reasoning_model when unset.
  assign_model: "claude-haiku-4-5"
  # PDF text is capped before being sent to Claude.
  max_pdf_chars: 80000

topics:
  min_topics: 6
  max_topics: 12
  # An emergent topic is created only when at least this many mutually
  # cohesive unassigned papers exist — prevents one-paper topics.
  emergent_min_papers: 3
  # refresh-topics: skip register synthesis when the github.io signals are
  # byte-identical to the last synthesized run (keeps topic wording stable,
  # which the incremental-recluster fingerprints depend on).
  skip_unchanged_signals: true

processing:
  # A full recluster is triggered when papers added since the last cluster
  # exceeds this threshold (or when --recluster is passed).
  recluster_threshold: 25
  # Quarantined papers: dropped from every source feed the moment it is fetched,
  # so they are never summarized, never assigned, never given a note and never
  # posted to Slack.
  #
  # The toread feed emits a `noauthor_undated-xx` bibtex key whenever an entry
  # has no author, title *and* date. The five below carry no source material at
  # all — their summaries read "No source material was provided" — so there is
  # nothing to write a note from. Deleting the note and summary (as b97aadd did)
  # is NOT enough: a missing summary is exactly what makes the summarizer treat
  # a paper as un-summarized and regenerate it, which is how they came back.
  # Their state entries are deliberately left in place.
  #
  # The junk keys themselves can only be fixed upstream in toread; this list is
  # the downstream quarantine. Note that noauthor_undated-bm is NOT skipped — it
  # is a real paper (the FIES deceptive-networks study) that merely has a junk
  # feed title ("cib.pdf"), and it is cited from the Structures notes.
  skip_keys:
    - noauthor_undated-bz
    - noauthor_undated-fm
    - noauthor_undated-jo
    - noauthor_undated-pl
    - noauthor_undated-ue
  # Incremental recluster: reuse the refresh-topics register and skip
  # assignment / emergent-clustering / structure-note LLM calls whose input
  # fingerprints are unchanged since the last run. `recluster --full`
  # overrides for a one-off complete pass.
  incremental_recluster: true

vault:
  path: "vault"
  papers_dir: "Papers"
  topics_dir: "Topics"
  structures_dir: "Structures"
  # Title of the published Quartz site homepage (the team fork overrides it).
  site_title: "MINE Zettelkasten"

slack:
  # Post a curated digest of each newly-added paper to the MINE #toread
  # channel — the team-wide announce channel (papers are *submitted* in
  # #zettelkasten; the digest *advertises* the resulting note to everyone).
  # The incoming-webhook URL is read from the SLACK_WEBHOOK_URL env var
  # (secret); posting is skipped entirely when that var is unset.
  # Own publications are never posted — they are not a reading list.
  enabled: true
  # Informational only — an incoming webhook is bound to its channel, so the
  # SLACK_WEBHOOK_URL secret MUST be a webhook created for #toread, not
  # #zettelkasten. This value does not route the post; it only documents intent.
  channel: "#toread"
  # Each digest links to the paper's full note on the live Quartz website — the
  # Slack post is only a digest; the note also carries methods, framing and
  # related papers. The "<bibtex-key>" slug is appended; unset to omit.
  # Note: the digest is posted earlier in the update-vault run than the Quartz
  # deploy, so a brand-new note's link 404s for the ~2-5 min until Pages goes
  # live — an accepted, self-healing window, not a bug.
  note_base_url: "https://fabiogiglietto.github.io/mine-zettelkasten/Papers"
  # Only team Slack submissions get a #toread digest from this kasten —
  # Paperpile papers flow through both pipelines and fg-zettelkasten already
  # announces them (digest_scope "all" would double-post).
  digest_scope: "team"
  # Team papers never get a research-radio episode — post immediately.
  episode_wait_days: 0

own_publications:
  # Fabio's own papers, processed by `update` as a second source alongside the
  # toread feed. They get vault notes (kind: own) but no Slack digest.
  # Set enabled: false to keep the team kasten free of own-publications.
  enabled: true
  # A note is built only when the paper is recent OR well-cited — old,
  # low-citation papers are skipped (re-checked every run, so a paper joins
  # automatically once it crosses the citation threshold).
  min_year: 2020
  min_citations: 5
  # Cap the per-run backfill so the first run is not a ~84-paper cost spike;
  # the daily cron drains the remaining queue over subsequent runs.
  max_per_run: 10

supersede:
  # A working paper is often re-added later in its published form under a new
  # bibtex key. When the two are recognized as the same work, the published note
  # wins and the working-paper note becomes a stub pointing at it — the file
  # stays so inbound [[wikilinks]] and the published site URL keep working, but
  # its topics are cleared so it leaves the registers.
  #
  # Direction is decided by publication status, never by arrival order: a
  # preprint added *after* the journal version is itself tombstoned.
  enabled: true
  # A cheap deterministic prefilter (title / author / abstract similarity) picks
  # candidates; Claude decides whether each pair really is one work. Only an
  # unhedged yes is applied. This caps the per-run Claude calls — pairs sharing a
  # DOI need none, and every verdict is cached in state so a rejected pair is
  # never re-billed.
  max_adjudications_per_run: 5
  openalex:
    # `check-published` asks OpenAlex whether preprints already in the vault have
    # since been published without anyone re-adding them. Such a paper has no
    # upstream bibtex key, so its note is upgraded in place (new DOI + venue,
    # old DOI kept as `preprint_doi`) rather than replaced.
    enabled: true
    # OpenAlex's polite pool — no API key, just a contact address.
    mailto: "fabio.giglietto@gmail.com"
    # Per-run cap; the scan is ordered oldest-check-first so it rotates through
    # the backlog rather than re-asking about the same few notes.
    max_lookups_per_run: 15
    recheck_after_days: 90

paths:
  topics_file: "data/topics.json"
  state_file: "data/state.json"
  summaries_dir: "data/summaries"
  cache_dir: "data/.cache"
